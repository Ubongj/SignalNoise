<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g1" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#0b1323" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="100%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0b1323" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#222a3a"/>
      <stop offset="100%" stop-color="#0b1323"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b1323"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- tagline -->
  <text x="600" y="150" text-anchor="middle" fill="#bdc8d1" font-family="Arial, Helvetica, sans-serif" font-size="30">
    Four players. Five clues. Only you know who&apos;s lying.
  </text>

  <!-- wordmark + compass -->
  <text x="486" y="358" text-anchor="end" fill="#dbe2f8" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="700" letter-spacing="-2">Signal</text>

  <g transform="translate(600,320)">
    <circle r="96" fill="#18202f" stroke="#3e484f" stroke-width="2"/>
    <circle r="88" fill="url(#face)" stroke="#3e484f" stroke-width="1"/>
    <text x="0" y="-64" text-anchor="middle" fill="#bdc8d1" font-family="Arial" font-size="16" font-weight="700">N</text>
    <text x="70" y="6" text-anchor="middle" fill="#bdc8d1" font-family="Arial" font-size="16" font-weight="700">E</text>
    <text x="0" y="76" text-anchor="middle" fill="#bdc8d1" font-family="Arial" font-size="16" font-weight="700">S</text>
    <text x="-70" y="6" text-anchor="middle" fill="#bdc8d1" font-family="Arial" font-size="16" font-weight="700">W</text>
    <polygon points="0,-56 -9,4 9,4" fill="#4ade80"/>
    <polygon points="0,56 -9,-4 9,-4" fill="#475569"/>
    <circle r="10" fill="#18202f" stroke="#3e484f" stroke-width="1"/>
  </g>

  <text x="714" y="358" text-anchor="start" fill="#bdc8d1" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="700" letter-spacing="-2">Noise</text>

  <!-- footer -->
  <text x="600" y="500" text-anchor="middle" fill="#4ade80" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Trust the signal. Block the noise.</text>
  <text x="600" y="548" text-anchor="middle" fill="#87929a" font-family="Arial, Helvetica, sans-serif" font-size="20">FHE-secured on-chain · Built on Fhenix · Arbitrum Sepolia</text>
</svg>
